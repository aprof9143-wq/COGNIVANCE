[project]
name = "cognivance-core"
version = "0.1.0"
description = "NIMBLE platform core — multi-modal Alzheimer's analysis with an implant-ready hardware abstraction."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
# Modality libraries are extras so the layer boundary is visible in packaging,
# not only in lint. imaging and eeg install what they own.
imaging = ["nibabel>=5.2", "nilearn>=0.10", "SimpleITK>=2.3"]
eeg = ["mne>=1.6", "scipy>=1.12"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognivance_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: downloads real open data; deselected by default with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Third-party scientific stack ships incomplete stubs.
module = ["nibabel.*", "nilearn.*", "mne.*", "SimpleITK.*", "scipy.*"]
ignore_missing_imports = true
