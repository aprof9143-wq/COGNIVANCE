name: vision-snapshot

# Captures the public reference records the Vision module shows for registered
# genes, from the sources the source policy permits (config/genome/licences.json;
# ClinVar is withheld and never requested), with one SHA-256 manifest per gene,
# into data/genome/snapshot/<gene>/, which the website does not serve. It then
# rebuilds the display-only copy the website serves, public/vision/display/<gene>/.
#
# Manual only. It used to run on every push that touched the capture tool or the
# gene registry, which could commit new captures to any branch unasked; while
# the source policy is under review, a person starts each capture.
on:
  workflow_dispatch:
    inputs:
      genes:
        description: "Space-separated HGNC symbols from config/genome/genes.json"
        default: "RPE65"
        required: true
      allow_partial:
        description: "Write a capture even if some sources failed (recorded in its manifest)"
        type: boolean
        default: false
      commit:
        description: "Commit the result (otherwise it is only uploaded as a workflow artifact)"
        type: boolean
        default: true
permissions:
  contents: write

concurrency:
  group: vision-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      GENES: ${{ github.event.inputs.genes || 'RPE65' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (offline)
        run: |
          python -m unittest discover -s tools/vision-snapshot -p "test_*.py" -v
          python -m unittest discover -s tools/genome-display -p "test_*.py" -v
      - name: Capture
        run: |
          args=""
          for g in $GENES; do args="$args --gene $g"; done
          if [ "${{ github.event.inputs.allow_partial }}" = "true" ]; then args="$args --allow-partial"; fi
          python tools/vision-snapshot/capture.py $args
      - name: Build the display-only copy
        run: |
          args=""
          for g in $GENES; do args="$args --gene $g"; done
          python tools/genome-display/build_display.py $args
      - name: Upload the capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vision-snapshot
          path: |
            data/genome/snapshot
            public/vision/display
          if-no-files-found: ignore
      - name: Commit the snapshot
        if: github.event.inputs.commit == 'true'
        # Another run may have pushed meanwhile. Rather than merging (two
        # captures of the same gene always conflict), put this run's gene
        # folders on top of the latest branch head: the newest capture wins.
        run: |
          git config user.name "vision-snapshot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r data/genome/snapshot "$RUNNER_TEMP/snapshot"
          cp -r public/vision/display "$RUNNER_TEMP/display"
          for attempt in 1 2 3; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git checkout -q -f --detach "origin/$GITHUB_REF_NAME"
            for g in $GENES; do
              d=$(echo "$g" | tr '[:upper:]' '[:lower:]')
              rm -rf "data/genome/snapshot/$d" "public/vision/display/$d"
              mkdir -p data/genome/snapshot public/vision/display
              cp -r "$RUNNER_TEMP/snapshot/$d" "data/genome/snapshot/$d"
              cp -r "$RUNNER_TEMP/display/$d" "public/vision/display/$d"
            done
            git add data/genome/snapshot public/vision/display
            if git diff --cached --quiet; then
              echo "Snapshot unchanged."
              exit 0
            fi
            git commit -q -m "data(vision): reference snapshot ${GENES} $(date -u +%Y-%m-%d)"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
